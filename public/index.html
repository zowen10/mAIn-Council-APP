<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mAIn Council Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <img src="/favicon.svg" alt="" width="30" height="30">
        <span><strong>mAIn Council</strong><small>Collaboration Hub</small></span>
      </a>
      <nav id="nav"></nav>
      <div class="sidebar-foot">Global mAIn Council · CXO Services</div>
    </aside>
    <div class="content">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <form class="search" id="searchForm" role="search">
          <input id="searchInput" type="search" placeholder="Search updates, actions, notes, wins…" aria-label="Search">
        </form>
        <div class="whoami" id="whoami"></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
